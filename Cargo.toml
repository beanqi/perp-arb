[package]
name = "perp-arb"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm-siv = "0.11"
axum = "0.8"
base64 = "0.22"
crossbeam-channel = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
